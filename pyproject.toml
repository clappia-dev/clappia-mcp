[project]
name = "clappia-mcp"
version = "1.0.0"
description = "MCP server that allows operations at Clappia"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.6",
    "python-jose[cryptography]>=3.5.0",
    "python-dotenv>=1.0.0",
    "clappia-api-tools",
    "fastmcp>=2.12.5",
    "mcp>=1.19.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.hatch.build.sources]
"src" = "."

# Make src directory discoverable as a package
[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.uv.sources]
clappia-api-tools = { path = "../clappia-tools" }
