[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["clappia_mcp", "tools", "utils"]

[project]
name = "clappia-mcp"
version = "1.0.0"
description = "MCP server that allows operations at Clappia"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "clappia-api-tools>=2.0.9",
    "mcp>=1.15.0",
    "smithery>=0.4.2",
]

[project.scripts]
dev = "smithery.cli.dev:main"
playground = "smithery.cli.playground:main"

# Points to your server function
[tool.smithery] 
server = "clappia_mcp.server:create_server"

[tool.uv]
package = true
