[project]
name = "clappia-mcp"
version = "1.0.0"
description = "MCP server that allows operations at Clappia"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "clappia-api-tools>=2.0.9",
    "fastmcp>=2.12.4",
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "python-multipart>=0.0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.hatch.build.sources]
"src" = "."

# Make src directory discoverable as a package
[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
